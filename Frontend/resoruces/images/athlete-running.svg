<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="48" cy="48" r="48" fill="#E3F2FD"/>
  
  <!-- Runner figure -->
  <!-- Head -->
  <circle cx="48" cy="20" r="8" fill="#FFB74D"/>
  
  <!-- Body -->
  <ellipse cx="48" cy="40" rx="6" ry="12" fill="#42A5F5"/>
  
  <!-- Arms in running position -->
  <ellipse cx="40" cy="35" rx="3" ry="8" fill="#FFB74D" transform="rotate(-20 40 35)"/>
  <ellipse cx="56" cy="35" rx="3" ry="8" fill="#FFB74D" transform="rotate(20 56 35)"/>
  
  <!-- Legs in running stride -->
  <ellipse cx="42" cy="55" rx="3" ry="12" fill="#1976D2" transform="rotate(-15 42 55)"/>
  <ellipse cx="54" cy="58" rx="3" ry="12" fill="#1976D2" transform="rotate(15 54 58)"/>
  
  <!-- Running shoes -->
  <ellipse cx="40" cy="70" rx="6" ry="3" fill="#424242"/>
  <ellipse cx="58" cy="73" rx="6" ry="3" fill="#424242"/>
  
  <!-- Motion lines -->
  <line x1="25" y1="45" x2="35" y2="45" stroke="#90A4AE" stroke-width="2" opacity="0.6"/>
  <line x1="25" y1="50" x2="33" y2="50" stroke="#90A4AE" stroke-width="2" opacity="0.4"/>
  <line x1="25" y1="55" x2="31" y2="55" stroke="#90A4AE" stroke-width="2" opacity="0.3"/>
  
  <!-- Speed effect lines -->
  <line x1="65" y1="40" x2="75" y2="40" stroke="#FF5722" stroke-width="2" opacity="0.7"/>
  <line x1="67" y1="45" x2="75" y2="45" stroke="#FF5722" stroke-width="2" opacity="0.5"/>
  <line x1="69" y1="50" x2="75" y2="50" stroke="#FF5722" stroke-width="2" opacity="0.3"/>
</svg>
